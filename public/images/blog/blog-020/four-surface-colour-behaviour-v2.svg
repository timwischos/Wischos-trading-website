<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">One black brief, four physical results</title>
  <desc id="desc">Technical comparison of black anodised aluminium, PVD-coated steel, natural titanium and soft-touch paperboard, showing differences in texture, reflection and undertone.</desc>
  <defs>
    <linearGradient id="aluminium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343941"/>
      <stop offset="0.5" stop-color="#171a1f"/>
      <stop offset="1" stop-color="#292d33"/>
    </linearGradient>
    <pattern id="brush" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M1 0V9M4 0V9M8 0V9" stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="pvd" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#090909"/>
      <stop offset="0.34" stop-color="#17120f"/>
      <stop offset="0.52" stop-color="#b9aaa0"/>
      <stop offset="0.58" stop-color="#29211c"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9b8b4"/>
      <stop offset="0.35" stop-color="#777b7d"/>
      <stop offset="0.68" stop-color="#a7a49e"/>
      <stop offset="1" stop-color="#5c6163"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="soft-light"/>
    </filter>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.8" fill="#ffffff" opacity="0.10"/>
      <circle cx="15" cy="13" r="0.7" fill="#ffffff" opacity="0.08"/>
      <path d="M1 18l8-2M12 4l7-1" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.8"/>
    </pattern>
    <style>
      .eyebrow { font: 600 18px Arial, sans-serif; letter-spacing: 3px; fill: #B87333; }
      .headline { font: 600 52px Georgia, serif; fill: #111111; }
      .intro { font: 22px Arial, sans-serif; fill: #5c5a56; }
      .index { font: 700 16px Arial, sans-serif; letter-spacing: 1px; fill: #B87333; }
      .name { font: 700 21px Arial, sans-serif; letter-spacing: 0.5px; fill: #171717; }
      .process { font: 600 14px Arial, sans-serif; letter-spacing: 1.4px; fill: #77736d; }
      .result { font: 19px Arial, sans-serif; fill: #252525; }
      .note { font: 17px Arial, sans-serif; fill: #66615b; }
      .footer { font: 600 20px Arial, sans-serif; fill: #25211d; }
    </style>
  </defs>

  <rect width="1600" height="850" fill="#f6f3ee"/>
  <rect x="52" y="52" width="64" height="5" fill="#B87333"/>
  <text x="52" y="93" class="eyebrow">MATERIAL BEHAVIOUR</text>
  <text x="52" y="151" class="headline">One black brief. Four physical results.</text>
  <text x="52" y="190" class="intro">The target colour is shared. The optical surfaces are not.</text>

  <g transform="translate(52 236)">
    <rect width="346" height="480" rx="4" fill="#ffffff" stroke="#ded8cf"/>
    <text x="24" y="38" class="index">01</text>
    <rect x="24" y="58" width="298" height="210" rx="3" fill="url(#aluminium)"/>
    <rect x="24" y="58" width="298" height="210" rx="3" fill="url(#brush)"/>
    <path d="M55 85V240" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>
    <text x="24" y="308" class="name">ANODISED ALUMINIUM</text>
    <text x="24" y="337" class="process">BRUSHED + DYED OXIDE</text>
    <text x="24" y="378" class="result">Cool · matte · directional</text>
    <text x="24" y="411" class="note">Fine grain changes with</text>
    <text x="24" y="435" class="note">the viewing angle.</text>
  </g>

  <g transform="translate(434 236)">
    <rect width="346" height="480" rx="4" fill="#ffffff" stroke="#ded8cf"/>
    <text x="24" y="38" class="index">02</text>
    <rect x="24" y="58" width="298" height="210" rx="3" fill="url(#pvd)"/>
    <path d="M191 58L265 58L155 268L82 268Z" fill="#ffffff" opacity="0.13"/>
    <text x="24" y="308" class="name">PVD-COATED STEEL</text>
    <text x="24" y="337" class="process">POLISHED BASE + COATING</text>
    <text x="24" y="378" class="result">Warm · glossy · reflective</text>
    <text x="24" y="411" class="note">Sharp highlights can make</text>
    <text x="24" y="435" class="note">a close colour look lighter.</text>
  </g>

  <g transform="translate(816 236)">
    <rect width="346" height="480" rx="4" fill="#ffffff" stroke="#ded8cf"/>
    <text x="24" y="38" class="index">03</text>
    <rect x="24" y="58" width="298" height="210" rx="3" fill="url(#titanium)" filter="url(#grain)"/>
    <path d="M24 205C90 165 205 180 322 112" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="18"/>
    <text x="24" y="308" class="name">NATURAL TITANIUM</text>
    <text x="24" y="337" class="process">SATIN METAL SURFACE</text>
    <text x="24" y="378" class="result">Grey · metallic · angle-sensitive</text>
    <text x="24" y="411" class="note">It can support black without</text>
    <text x="24" y="435" class="note">pretending to be black.</text>
  </g>

  <g transform="translate(1198 236)">
    <rect width="346" height="480" rx="4" fill="#ffffff" stroke="#ded8cf"/>
    <text x="24" y="38" class="index">04</text>
    <rect x="24" y="58" width="298" height="210" rx="3" fill="#161616"/>
    <rect x="24" y="58" width="298" height="210" rx="3" fill="url(#paper)"/>
    <text x="24" y="308" class="name">SOFT-TOUCH PAPERBOARD</text>
    <text x="24" y="337" class="process">INK + SURFACE COATING</text>
    <text x="24" y="378" class="result">Deep · flat · light-absorbing</text>
    <text x="24" y="411" class="note">It may anchor the palette,</text>
    <text x="24" y="435" class="note">but cannot approve the metals.</text>
  </g>

  <line x1="52" y1="763" x2="1548" y2="763" stroke="#d7d0c6"/>
  <circle cx="67" cy="803" r="7" fill="#B87333"/>
  <text x="88" y="811" class="footer">Approve the relationship between surfaces—not the word “black”.</text>
</svg>
